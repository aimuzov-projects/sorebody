# Сайт на сервере проектов. Порты 80/443 занимает общий Caddy
# из aimuzov-projects/infra-server, он проксирует сюда домен через сеть `edge`.

name: wodcare

x-logging: &logging
  driver: json-file
  options:
    max-size: '5m'
    max-file: '2'

services:
  site:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      secrets: [env]
    image: wodcare
    container_name: wodcare
    restart: unless-stopped
    networks:
      - edge
    logging: *logging

  # Публичный MCP и чат на сайте. Caddy проксирует сюда /mcp и /api/chat, остальное -- в site.
  api:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: wodcare-api
    container_name: wodcare-api
    restart: unless-stopped
    # Ключ OpenRouter и настройки чата, образец -- `api.env.example`. Файла нет -- чат
    # выключен, MCP работает как раньше.
    env_file:
      - path: ../api.env
        required: false
    # Из РФ OpenRouter отвечает 403, поэтому чат ходит наружу через общий VPN-выход
    # из infra-server.
    environment:
      HTTPS_PROXY: http://vpn:3128
      NODE_USE_ENV_PROXY: '1'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8787/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - edge
      - vpn
    logging: *logging

# Переменные сборки лежат в `/srv/wodcare/.env`, образец -- `.env.example`. Переменные
# бэкенда -- в `/srv/wodcare/api.env`, образец -- `api.env.example`.
secrets:
  env:
    file: ../.env

networks:
  edge:
    name: edge
    external: true
  vpn:
    name: vpn
    external: true
