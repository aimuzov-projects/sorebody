# nginx внутри контейнера sorebody. TLS, сжатие и домен -- на общем Caddy,
# запросы приходят сюда через сеть `edge` уже расшифрованными.

# Модель страница берёт с версией `?v=<хеш файлов>` (src/frontend/scene/model-url.ts): у новой
# модели новый адрес, поэтому версия кешируется навсегда. Без версии -- переспрашиваем.
map $arg_v $model_cache {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # За прокси абсолютный редирект вёл бы на http://sorebody,
    # поэтому отдаём относительный.
    absolute_redirect off;
    error_page 404 /404.html;

    # Ассеты Astro с хешем в имени никогда не меняются, поэтому кешируем их навсегда.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /model/ {
        add_header Cache-Control $model_cache;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
