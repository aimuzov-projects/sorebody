# nginx внутри контейнера __PROJECT__. TLS, сжатие и домен -- на общем Caddy,
# запросы приходят сюда через сеть `edge` уже расшифрованными.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # За прокси абсолютный редирект вёл бы на http://__PROJECT__,
    # поэтому отдаём относительный.
    absolute_redirect off;
    error_page 404 /404.html;

    # Ассеты Astro с хешем в имени никогда не меняются, поэтому кешируем их навсегда.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
